<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My ElectroCare | Service Passport</title>
<style>body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#0f172a}.wrap{max-width:760px;margin:28px auto;padding:16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0f172a12;margin-bottom:16px}h1{margin:0 0 6px;color:#087f5b}.muted{color:#64748b}.pill{display:inline-block;background:#dcfce7;color:#166534;padding:6px 10px;border-radius:20px;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:12px;background:#f8fafc;border-radius:10px;overflow-wrap:anywhere}.field b{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.history{border-left:3px solid #0d9488;padding:4px 0 14px 14px;margin:12px 0}.error{color:#b91c1c}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><section class="card"><h1>⚡ My ElectroCare</h1><div class="muted">Electronics Repair & Home Service</div><hr style="border:0;border-top:1px solid #e2e8f0;margin:18px 0"><h2>Appliance Service Passport</h2><div id="state" class="muted">Loading service history…</div></section><div id="content"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Paste the SAME public project URL and anon/publishable key used by index.html. Never use service_role here.
const SUPABASE_URL="PASTE_YOUR_EXISTING_SUPABASE_URL_HERE";
const SUPABASE_ANON_KEY="PASTE_YOUR_EXISTING_SUPABASE_ANON_KEY_HERE";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const esc=v=>String(v??"-").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString("en-IN"):"-";
(async()=>{const token=new URLSearchParams(location.search).get("token");if(!token){document.getElementById("state").innerHTML='<span class="error">Invalid QR code.</span>';return;}const {data,error}=await db.rpc("mec_public_service_passport",{p_qr_token:token});if(error||!data){document.getElementById("state").innerHTML='<span class="error">Service Passport nahi mil paya. QR code check karein.</span>';console.error(error);return;}document.getElementById("state").innerHTML='<span class="pill">Verified appliance record</span>';const a=data.appliance||{};const h=data.history||[];let html='<section class="card"><h2>Appliance Details</h2><div class="row">'+[['Appliance ID',a.appliance_code],['Customer ID',data.customer_code],['Appliance',a.appliance_name],['Brand',a.brand],['Model',a.model]].map(x=>'<div class="field"><b>'+esc(x[0])+'</b>'+esc(x[1])+'</div>').join('')+'</div></section><section class="card"><h2>Service History</h2>';
if(!h.length) html+='<p class="muted">Abhi koi service record available nahi hai.</p>';h.forEach(x=>{html+='<div class="history"><b>Complaint #'+esc(x.complaint_id)+'</b><p class="muted">Complaint: '+esc(fmt(x.complaint_date))+'</p><p><b>Problem:</b> '+esc(x.complaint_details)+'</p><p><b>Mechanic:</b> '+esc(x.mechanic_name||'Not recorded')+'</p><p><b>Service completed:</b> '+esc(fmt(x.service_completed_at))+'</p><p><b>Work done:</b> '+esc(x.work_done)+'</p><p><b>Parts:</b> '+esc((x.parts||[]).map(p=>typeof p==='string'?p:(p.name||'')+(p.price?' — ₹'+p.price:'')).join(', ')||'—')+'</p><p><b>Warranty:</b> '+esc(x.warranty_start||'-')+' to '+esc(x.warranty_expiry||'-')+'</p><span class="pill">'+esc(x.service_status)+'</span></div>';});html+='</section><p class="muted" style="text-align:center;font-size:12px">Customer mobile number aur home address is public page par show nahi hote.</p>';document.getElementById("content").innerHTML=html;})();
</script></body></html>
